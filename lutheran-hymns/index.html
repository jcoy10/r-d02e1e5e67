<!DOCTYPE html>
<!--
  Adding a hymn:
  1. Drop hymn-<N>.html into this lutheran-hymns/ folder. Do not edit the player.
  2. Add one line to the HYMNS array in the script below.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7b1e2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lutheran Hymns">
  <title>Lutheran Hymns</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f3eadb'/%3E%3Cpath fill='%237b1e2b' d='M14 3h4v26h-4zM5 11h22v4H5z'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23f3eadb'/%3E%3Cpath fill='%237b1e2b' d='M78 22h24v136H78zM28 64h124v24H28z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    /*
      Adding a hymn:
      1. Drop hymn-<N>.html into this lutheran-hymns/ folder. Do not edit the player.
      2. Add one line to the HYMNS array below.

      Take title from the player's heading:
        Hymn 621
        Let All Mortal Flesh Keep Silence
      line    — first line, only when it is different from the title (optional)
      section — section name (optional). Leave "" on every hymn for one list.
      Leave any field you do not have blank. Do not invent titles.
      The page sorts by hymn number. Search matches number and title.
    */
    const HYMNS = [
      { number: 508, title: "The Day Is Surely Drawing Near", file: "hymn-508.html", section: "" },
      { number: 559, title: "Oh, How Great Is Your Compassion", file: "hymn-559.html", section: "" },
      { number: 621, title: "Let All Mortal Flesh Keep Silence", file: "hymn-621.html", section: "" },
      { number: 627, title: "Jesus Christ, Our Blessed Savior", file: "hymn-627.html", section: "" },
      { number: 666, title: "O Little Flock, Fear Not the Foe", file: "hymn-666.html", section: "" },
      { number: 668, title: "Rise! To Arms! With Prayer Employ You", file: "hymn-668.html", section: "" },
      { number: 905, title: "Come, Thou Almighty King", file: "hymn-905.html", section: "" },
    ];
  </script>
  <style>
    :root {
      --parchment: #f3eadb;
      --ink: #1c140f;
      --red: #7b1e2b;
      --red-deep: #5c1420;
      --muted: #6d5b4e;
      --rule: rgba(123, 30, 43, 0.85);
      --hairline: rgba(70, 44, 28, 0.16);
      --serif: "EB Garamond", "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      --display: "Cormorant Garamond", "EB Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    }

    * { box-sizing: border-box; }

    html {
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.05rem;
      line-height: 1.45;
      background-color: var(--parchment);
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -8%, rgba(255, 252, 245, 0.95), transparent 70%),
        linear-gradient(180deg, rgba(123, 30, 43, 0.035), transparent 12rem);
    }

    .sheet {
      width: min(40rem, 100%);
      margin: 0 auto;
      padding:
        calc(2rem + env(safe-area-inset-top))
        max(1.15rem, env(safe-area-inset-right))
        calc(2.75rem + env(safe-area-inset-bottom))
        max(1.15rem, env(safe-area-inset-left));
    }

    .mast { text-align: center; }

    .cross {
      display: block;
      width: 1.35rem;
      height: 1.85rem;
      margin: 0 auto 0.85rem;
      color: var(--red);
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(2.6rem, 10vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: 0.01em;
    }

    .rules {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
      margin: 1.05rem auto 0;
    }

    .rules span {
      display: block;
      height: 1px;
      background: var(--rule);
    }

    .rules span:first-child { width: 7.25rem; }
    .rules span:last-child { width: 4.25rem; opacity: 0.55; }

    .find { margin: 2rem 0 0; }

    .find label {
      display: block;
      margin-bottom: 0.4rem;
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .search-row { position: relative; }

    input[type="search"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      margin: 0;
      padding: 0.85rem 4.5rem 0.8rem 0.15rem;
      border: 0;
      border-bottom: 1px solid var(--red);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.15rem;
      line-height: 1.3;
    }

    input[type="search"]::placeholder { color: #9a8778; }

    input[type="search"]:focus {
      outline: none;
      border-bottom-width: 2px;
      padding-bottom: calc(0.8rem - 1px);
    }

    #clear {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--red);
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 0.1rem;
      min-height: 2.75rem;
      cursor: pointer;
    }

    #clear[hidden] { display: none; }

    .count {
      min-height: 1.4rem;
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-style: italic;
      font-size: 1rem;
    }

    #list { margin-top: 0.85rem; }

    .group + .group { margin-top: 1.75rem; }

    .section {
      margin: 0 0 0.35rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--red);
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--red-deep);
    }

    .hymns {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .hymn {
      display: grid;
      grid-template-columns: 5.15rem minmax(0, 1fr) 0.9rem;
      column-gap: 0.75rem;
      align-items: center;
      min-height: 4.6rem;
      padding: 0.95rem 0.15rem 1rem 0.15rem;
      border-bottom: 1px solid var(--hairline);
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: rgba(123, 30, 43, 0.12);
    }

    .hymn:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .hymn:active { background: rgba(123, 30, 43, 0.06); }

    @media (hover: hover) {
      .hymn:hover { background: rgba(123, 30, 43, 0.045); }
    }

    .num {
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: var(--red);
      font-variant-numeric: lining-nums tabular-nums;
    }

    .num-label {
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.22rem;
    }

    .num-digits {
      font-family: var(--display);
      font-weight: 600;
      font-size: 2.05rem;
      line-height: 1;
      letter-spacing: 0.02em;
    }

    .text { min-width: 0; }

    .title {
      display: block;
      font-size: 1.28rem;
      font-weight: 500;
      line-height: 1.22;
      overflow-wrap: break-word;
    }

    .line {
      display: block;
      margin-top: 0.12rem;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.3;
      color: #3a2c24;
    }

    .go {
      justify-self: end;
      color: var(--red);
      font-family: var(--display);
      font-size: 1.7rem;
      line-height: 1;
    }

    .empty {
      margin: 1.5rem 0 0;
      font-style: italic;
      color: var(--muted);
    }

    .colophon {
      margin-top: 2.4rem;
      text-align: center;
      color: var(--muted);
      font-family: var(--display);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }

    @media (min-width: 720px) {
      body { padding: 2.25rem 1.25rem; }

      .sheet {
        padding: 2.75rem 2.4rem 3rem;
        background: rgba(251, 246, 236, 0.45);
        border: 1px solid rgba(90, 55, 30, 0.14);
        box-shadow: 0 18px 50px rgba(60, 30, 12, 0.05);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="mast">
      <svg class="cross" viewBox="0 0 48 68" aria-hidden="true">
        <path d="M24 2v64M6 20h36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/>
      </svg>
      <h1>Lutheran Hymns</h1>
      <div class="rules" aria-hidden="true"><span></span><span></span></div>
    </header>

    <form id="find" class="find" role="search">
      <label for="q">Search</label>
      <div class="search-row">
        <input id="q" type="search" placeholder="Number or title" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button type="button" id="clear" hidden>Clear</button>
      </div>
    </form>
    <p id="count" class="count" aria-live="polite"></p>
    <div id="list"></div>

    <footer class="colophon">
      <p>Piano accompaniments</p>
    </footer>
  </div>

  <script>
    (function () {
      var input = document.getElementById("q");
      var clearBtn = document.getElementById("clear");
      var list = document.getElementById("list");
      var count = document.getElementById("count");

      function fold(value) {
        return String(value == null ? "" : value)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      function byNumber(a, b) {
        return (Number(a.number) - Number(b.number)) || fold(a.title).localeCompare(fold(b.title));
      }

      function groupsOf(hymns) {
        var sorted = hymns.slice().sort(byNumber);
        var anySection = sorted.some(function (h) {
          return String(h.section || "").trim();
        });
        if (!anySection) return [{ name: "", hymns: sorted }];

        // Headings follow hymn-number order. A section stays together
        // when its hymns are contiguous; a blank section has no heading.
        var groups = [];
        sorted.forEach(function (h) {
          var name = String(h.section || "").trim();
          var last = groups[groups.length - 1];
          if (!last || last.name !== name) groups.push({ name: name, hymns: [h] });
          else last.hymns.push(h);
        });
        return groups;
      }

      function matches(hymn, query) {
        if (!query) return true;
        var blob = ["hymn " + hymn.number, hymn.number, hymn.title, hymn.line].map(fold).join(" ");
        return blob.indexOf(query) !== -1;
      }

      function addSpan(parent, className, text) {
        if (!text) return;
        var span = document.createElement("span");
        span.className = className;
        span.textContent = text;
        parent.appendChild(span);
      }

      function hymnLink(hymn) {
        var link = document.createElement("a");
        link.className = "hymn";
        link.href = hymn.file || "#";
        link.setAttribute("aria-label", "Hymn " + hymn.number + ", " + (hymn.title || ""));

        var num = document.createElement("span");
        num.className = "num";
        var lab = document.createElement("span");
        lab.className = "num-label";
        lab.textContent = "Hymn";
        var dig = document.createElement("span");
        dig.className = "num-digits";
        dig.textContent = hymn.number;
        num.appendChild(lab);
        num.appendChild(dig);

        var text = document.createElement("span");
        text.className = "text";
        addSpan(text, "title", hymn.title || "");
        addSpan(text, "line", String(hymn.line || "").trim());

        var go = document.createElement("span");
        go.className = "go";
        go.setAttribute("aria-hidden", "true");
        go.textContent = "\u203A";

        link.appendChild(num);
        link.appendChild(text);
        link.appendChild(go);
        return link;
      }

      function render() {
        var query = fold(input.value.trim());
        var filtered = HYMNS.filter(function (hymn) { return matches(hymn, query); });
        var groups = groupsOf(filtered);

        list.textContent = "";
        clearBtn.hidden = !input.value;

        if (!filtered.length) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No hymns match that search.";
          list.appendChild(empty);
        } else {
          groups.forEach(function (group) {
            var section = document.createElement("section");
            section.className = "group";
            if (group.name) {
              var heading = document.createElement("h2");
              heading.className = "section";
              heading.textContent = group.name;
              section.appendChild(heading);
            }
            var ul = document.createElement("ul");
            ul.className = "hymns";
            group.hymns.forEach(function (hymn) {
              var item = document.createElement("li");
              item.appendChild(hymnLink(hymn));
              ul.appendChild(item);
            });
            section.appendChild(ul);
            list.appendChild(section);
          });
        }

        var noun = filtered.length === 1 ? "hymn" : "hymns";
        count.textContent = filtered.length + " " + noun;
      }

      input.addEventListener("input", render);
      clearBtn.addEventListener("click", function () {
        input.value = "";
        render();
        input.focus();
      });
      document.getElementById("find").addEventListener("submit", function (event) {
        event.preventDefault();
        input.blur();
      });
      render();
    })();
  </script>
</body>
</html>
